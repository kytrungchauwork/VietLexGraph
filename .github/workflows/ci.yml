name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip==26.2.1
      - run: pip install -r requirements-test.txt
      - run: python scripts/check_public_release.py
      - run: ruff check src scripts tests app.py
      - run: ruff format --check src scripts tests app.py
      - run: pytest --cov=src --cov=app --cov-report=term-missing --cov-report=xml
      - run: pip check
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
